server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        image/svg+xml svg;
        application/json json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    access_log /var/log/nginx/herby-access.log;
    error_log /var/log/nginx/herby-error.log;
}
