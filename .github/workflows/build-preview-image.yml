name: Build preview container

on:
  push:
    branches:
      - 'feature/**'
      - 'feature-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_TAG="${IMAGE_TAGS%%$'\n'*}"
          {
            echo "### Preview container image"
            echo '```'
            echo "podman pull $IMAGE_TAG"
            echo "podman run --rm --name rent-a-herby-preview -p 8080:80 $IMAGE_TAG"
            echo '```'
            echo "Open the preview at [http://localhost:8080](http://localhost:8080)."
          } >> "$GITHUB_STEP_SUMMARY"
