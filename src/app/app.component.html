<header class="bg-slate-400">
	<h1 class="font-bold text-center text-cyan-950">Rent a Herby</h1>    
	<div class="grid grid-flow-row sm:grid-flow-col sm:text-xs ">    
		<button routerLink="/home" class=" hover:underline uppercase text-sm">Home</button>
		<button routerLink="/rental"class=" hover:underline uppercase text-sm">Rund um Herby</button>
		<button routerLink="/accessories" class="hover:underline uppercase text-sm">Reisezubehör</button>
   		<!-- <button routerLink="/travelroutes" class="hover:underline uppercase text-sm">Reiserouten</button> -->
    	<button routerLink="/contact" class="hover:underline uppercase text-sm">Kontakt</button>
  	</div>  
  	<div >
		<p-carousel 
			[value]="herbyPictures" 
			[numVisible]="4" 
			[numScroll]="3" 
			[circular]="true" 
			[autoplayInterval]="9000"
			[responsiveOptions]="responsiveOptions">

			<ng-template let-picture pTemplate="item">
				<div class="border-1 surface-border border-round m-2 text-center py-5 px-3">
					<div class="mb-3">
						<img 
							class="shadow-2" 	
							src="{{ picture.imagePath }}" />
					</div>            
				</div>
			</ng-template>
		</p-carousel>
	</div>
</header>

<main class="main pb-3 pt-5">  
	<router-outlet></router-outlet>
</main>

<mat-divider></mat-divider>

<footer class="text-center text-xs pt-1">Version: {{AppVersion}}</footer>
