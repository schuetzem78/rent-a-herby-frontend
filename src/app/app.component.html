<header>
	<mat-toolbar>
		<button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menu Button">
		  <mat-icon>menu</mat-icon>
		</button>
		<mat-menu #menu="matMenu">
			<button mat-menu-item routerLink="/home">
			  <mat-icon>home</mat-icon>
			  <span>Startseite</span>
			</button>
			<button mat-menu-item routerLink="/rental">
				<mat-icon>car_rental</mat-icon>
				<span>Wohnmobilvermietung</span>
			  </button>
			<button mat-menu-item routerLink="/accessories">
				<mat-icon>beach_access</mat-icon>
				<span>Reisezubehör</span>
			</button>
			<!--<button mat-menu-item routerLink="/travelroutes">
				<mat-icon>map</mat-icon>
				<span>Reiserouten</span>
			</button>-->
			<button mat-menu-item routerLink="/contact">
			  <mat-icon >mail</mat-icon>
			  <span>Kontakt</span>
			</button>			
		  </mat-menu>
		

		<span class="font-bold text-cyan-950">Rent a Herby</span>
		<span class="spacer"></span>	
		<button mat-icon-button>
		  <mat-icon>share</mat-icon>
		</button>
		
	</mat-toolbar>	
		  
  	<div class="bg-gray-100">
		<p-carousel 
			[value]="herbyPictures" 
			[numVisible]="6" 
			[numScroll]="3" 
			[circular]="true" 
			[autoplayInterval]="9000"
			[responsiveOptions]="responsiveOptions">

			<ng-template let-picture pTemplate="item">
				<div class="text-center px-3">
					<div>
						<img 
							class="shadow-2" 	
							src="{{ picture.imagePath }}" />
					</div>            
				</div>
			</ng-template>
		</p-carousel>
	</div>
</header>

<main class="main pb-3 pt-5">  
	<router-outlet></router-outlet>
</main>

<mat-divider></mat-divider>

<footer class="text-center text-xs pt-1">Version: {{AppVersion}}</footer>
